<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DartTrip 飛鏢旅行</title>
<meta name="description" content="把紙飛機當成飛鏢，拖曳射出後，飛機降落在地圖上的哪裡，下一趟旅行就去哪裡。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ocean-top: #0f2a5c;
    --ocean-bottom: #061430;
    --land: #efe3c8;
    --land-edge: #b9a57f;
    --hit: #e5484d;
    --hit-glow: #ff8a8f;
    --ink: #1d2433;
    --paper: #fffaf0;
    --accent: #ffb547;
    --ui: rgba(255, 255, 255, 0.1);
    --ui-border: rgba(255, 255, 255, 0.22);
    --text: #f3f6ff;
    --muted: rgba(243, 246, 255, 0.68);
    --header-h: 60px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--ocean-bottom);
    color: var(--text);
    font-family: "Noto Sans TC", system-ui, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

  /* ---------- Header ---------- */
  header {
    height: var(--header-h);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: rgba(4, 12, 32, 0.85);
    border-bottom: 1px solid var(--ui-border);
    position: relative;
    z-index: 20;
  }
  .logo { font-weight: 900; font-size: 22px; letter-spacing: 0.5px; }
  .logo span { color: var(--accent); }
  .tabs { display: flex; gap: 4px; background: var(--ui); padding: 4px; border-radius: 999px; }
  .tabs button {
    border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; font-weight: 700;
    color: var(--muted); transition: background 0.2s, color 0.2s;
  }
  .tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); }
  .tabs button:disabled { cursor: not-allowed; opacity: 0.5; }

  /* ---------- 舞台 ---------- */
  #stage {
    position: absolute;
    inset: var(--header-h) 0 0 0;
    background: radial-gradient(120% 90% at 50% 30%, var(--ocean-top), var(--ocean-bottom));
    touch-action: none;
    overflow: hidden;
  }
  #map {
    position: absolute;
    top: 64px; bottom: 170px; left: 12px; right: 12px;
    width: calc(100% - 24px); height: calc(100% - 234px);
    transition: filter 0.35s ease-out;
  }
  #map .land {
    fill: var(--land);
    stroke: var(--land-edge);
    stroke-width: 0.7;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: round;
  }
  #map .land.hit { animation: hitPulse 0.9s ease-in-out infinite alternate; }
  @keyframes hitPulse { from { fill: var(--hit); } to { fill: var(--hit-glow); } }
  #map .inset rect { fill: rgba(255, 255, 255, 0.05); stroke: rgba(255, 255, 255, 0.45); stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }
  #map .inset text { fill: var(--muted); font-weight: 700; }
  .pin-ripple {
    fill: none; stroke: var(--hit); transform-box: fill-box; transform-origin: center;
    animation: ripple 1.6s ease-out infinite;
  }
  .pin-ripple.late { animation-delay: 0.8s; }
  @keyframes ripple { from { transform: scale(1); opacity: 0.9; } to { transform: scale(5); opacity: 0; } }

  #fog {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 45%, rgba(220, 230, 255, 0.55), rgba(180, 195, 230, 0.35));
    transition: opacity 0.35s ease-out;
  }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #plane, #shadow { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; }
  #plane svg { display: block; width: 46px; height: 46px; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.25)); }
  #shadow { width: 34px; height: 12px; border-radius: 50%; background: rgba(0, 0, 0, 0.35); filter: blur(2px); opacity: 0; }

  /* ---------- 浮動 UI ---------- */
  .chip {
    position: absolute; top: 12px; z-index: 10;
    background: rgba(6, 18, 44, 0.72); border: 1px solid var(--ui-border); border-radius: 14px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #logBtn { left: 12px; padding: 8px 14px; font-weight: 700; }
  #logPanel {
    position: absolute; top: 58px; left: 12px; z-index: 11; width: min(320px, calc(100% - 24px));
    max-height: 55%; overflow: auto; padding: 8px; display: none;
    background: rgba(6, 18, 44, 0.92); border: 1px solid var(--ui-border); border-radius: 14px;
  }
  #logPanel.open { display: block; }
  #logPanel h3 { margin: 6px 8px 8px; font-size: 14px; color: var(--muted); }
  #logPanel ol { list-style: none; margin: 0; padding: 0; }
  #logPanel li { display: flex; justify-content: space-between; gap: 8px; padding: 8px; border-radius: 10px; }
  #logPanel li:nth-child(odd) { background: var(--ui); }
  #logPanel li small { color: var(--muted); white-space: nowrap; }
  #logPanel .empty { padding: 8px; color: var(--muted); }

  #compass { right: 12px; padding: 8px 12px 8px 8px; display: flex; align-items: center; gap: 10px; }
  #compass svg { width: 46px; height: 46px; }
  #compass .arrow { transition: transform 0.6s cubic-bezier(.3, 1.4, .5, 1); transform-origin: 23px 23px; }
  #compass .wind-text { font-size: 13px; line-height: 1.35; }
  #compass .wind-text b { display: block; font-size: 14px; }

  #hud {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5;
    text-align: center; pointer-events: none; width: min(420px, 90%);
  }
  #hint { font-weight: 700; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6); min-height: 1.4em; }
  #power { margin: 8px auto 0; width: 220px; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.18); overflow: hidden; opacity: 0; transition: opacity 0.2s; }
  #power i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #6ee7b7, var(--accent), var(--hit)); }
  #powerText { font-size: 12px; color: var(--muted); margin-top: 4px; min-height: 1.2em; }

  #toast {
    position: absolute; top: 14px; left: 50%; z-index: 30; max-width: min(520px, 90%);
    transform: translate(-50%, -160%); opacity: 0; visibility: hidden;
    transition: transform 0.35s cubic-bezier(.2, 1.2, .4, 1), opacity 0.2s, visibility 0s 0.35s;
    background: var(--paper); color: var(--ink); font-weight: 700; padding: 10px 18px; border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); text-align: center;
  }
  #toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; transition-delay: 0s; }

  /* ---------- 登機證 ---------- */
  #pass {
    position: absolute; left: 50%; bottom: 16px; z-index: 25; width: min(640px, calc(100% - 24px));
    display: flex; color: var(--ink); filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.45));
    transform: translate(-50%, 130%); transition: transform 0.55s cubic-bezier(.2, 1.1, .3, 1);
  }
  #pass.show { transform: translate(-50%, 0); }
  .pass-main, .pass-stub { background: var(--paper); }
  .pass-main { flex: 1; padding: 16px 20px; border-radius: 18px 0 0 18px; border-right: 2px dashed #d9cdb3; }
  .pass-stub { width: 168px; padding: 16px; border-radius: 0 18px 18px 0; display: flex; flex-direction: column; gap: 8px; }
  .pass-top { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #8a7a5a; letter-spacing: 1px; }
  .route { display: flex; align-items: center; justify-content: space-between; margin: 10px 0 6px; }
  .route > div { display: flex; flex-direction: column; }
  .route > div:last-child { text-align: right; }
  .route small, .pass-stub small { font-size: 11px; font-weight: 700; color: #8a7a5a; letter-spacing: 1px; }
  .route b { font-size: 38px; line-height: 1.05; }
  .route .fly { flex: 1; text-align: center; color: #c9b48f; font-size: 22px; position: relative; }
  .route .fly::before { content: ""; position: absolute; left: 12%; right: 12%; top: 50%; border-top: 2px dashed #d9cdb3; z-index: -1; }
  .dest { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .dest b { font-size: 24px; font-weight: 900; }
  .dest span:last-child { color: #6b6250; }
  .note { margin-top: 8px; font-size: 13px; color: #5b5242; background: #f4ecd9; border-radius: 10px; padding: 8px 10px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button { flex: 1; border: 0; border-radius: 12px; padding: 10px; font-weight: 700; }
  #again { background: var(--ink); color: var(--paper); }
  #share { background: var(--accent); color: var(--ink); }
  .pass-stub b { font-size: 17px; display: block; }
  .barcode { margin-top: auto; height: 44px; display: flex; align-items: stretch; gap: 2px; }
  .barcode i { background: var(--ink); }

  @media (max-width: 560px) {
    :root { --header-h: 52px; }
    header { padding: 0 12px; }
    .logo { font-size: 18px; }
    .tabs button { padding: 5px 11px; font-size: 14px; }
    #map { top: 66px; bottom: 160px; height: calc(100% - 226px); }
    #compass .wind-text { font-size: 12px; }
    #compass svg { width: 38px; height: 38px; }
    #pass { flex-direction: column; bottom: 10px; }
    .pass-main { border-radius: 18px 18px 0 0; border-right: 0; border-bottom: 2px dashed #d9cdb3; padding: 14px 16px; }
    .pass-stub { width: auto; border-radius: 0 0 18px 18px; flex-direction: row; align-items: center; padding: 10px 16px; }
    .route b { font-size: 30px; }
    .dest b { font-size: 20px; }
    .barcode { margin: 0 0 0 auto; height: 30px; width: 70px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">DartTrip <span>✈</span></div>
  <nav class="tabs" role="tablist" aria-label="選擇地圖">
    <button role="tab" data-map="taiwan">台灣</button>
    <button role="tab" data-map="japan">日本</button>
    <button role="tab" data-map="world">世界</button>
  </nav>
</header>

<main id="stage">
  <svg id="map" preserveAspectRatio="xMidYMid meet" aria-label="地圖">
    <g id="regions"></g>
    <g id="insets"></g>
    <g id="pins"></g>
  </svg>
  <div id="fog"></div>
  <svg id="fx" aria-hidden="true">
    <polyline id="trail" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2.5" stroke-dasharray="7 9" stroke-linecap="round"/>
    <g id="sling">
      <path id="slingFrame" fill="none" stroke="#8b5a2b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline id="band" fill="none" stroke="#5b2a12" stroke-width="3.5" stroke-linejoin="round"/>
    </g>
    <path id="arc" fill="none" stroke="#ffd27a" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12" opacity="0"/>
  </svg>
  <div id="shadow"></div>
  <div id="plane">
    <!-- 紙飛機，機頭朝上 -->
    <svg viewBox="0 0 48 48"><path d="M24 2 L42 44 L24 34 Z" fill="#ffffff"/><path d="M24 2 L6 44 L24 34 Z" fill="#dfe7f5"/><path d="M24 2 L24 34" stroke="#9fb0cc" stroke-width="1.2"/></svg>
  </div>

  <button id="logBtn" class="chip">🧳 飛行紀錄</button>
  <div id="logPanel"><h3>最近 20 筆飛行紀錄</h3><ol id="logList"></ol></div>

  <div id="compass" class="chip" aria-live="polite">
    <svg viewBox="0 0 46 46" aria-hidden="true">
      <circle cx="23" cy="23" r="21" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.35)"/>
      <text x="23" y="10" text-anchor="middle" font-size="7" fill="#ffd27a" font-weight="700">N</text>
      <g class="arrow"><path d="M23 9 L28 22 L23 19 L18 22 Z" fill="#ffd27a"/><line x1="23" y1="19" x2="23" y2="36" stroke="#ffd27a" stroke-width="2.5" stroke-linecap="round"/></g>
    </svg>
    <div class="wind-text"><b id="windDir"></b><span id="windDetail"></span></div>
  </div>

  <div id="hud">
    <div id="hint">按住畫面任一處往後拉，放開就起飛</div>
    <div id="power"><i></i></div>
    <div id="powerText"></div>
  </div>

  <div id="toast" role="status"></div>

  <section id="pass" aria-live="polite" aria-hidden="true">
    <div class="pass-main">
      <div class="pass-top"><span>✈ DARTTRIP AIRLINES</span><span>BOARDING PASS 登機證</span></div>
      <div class="route">
        <div><small>FROM</small><b class="mono">TPE</b><span>台北</span></div>
        <div class="fly">✈</div>
        <div><small>TO</small><b class="mono" id="toCode"></b><span id="toName"></span></div>
      </div>
      <div class="dest"><b id="destName"></b><span id="destEn"></span></div>
      <div class="note" id="passNote"></div>
      <div class="actions"><button id="again">再射一次</button><button id="share">分享</button></div>
    </div>
    <div class="pass-stub">
      <div><small>FLIGHT</small><b class="mono" id="flightNo"></b></div>
      <div><small>DATE</small><b class="mono" id="flightDate"></b></div>
      <div><small>SEAT</small><b class="mono" id="seat"></b></div>
      <div class="barcode" id="barcode"></div>
    </div>
  </section>
</main>

  let pull = null;       // { id, sx, sy, x, y, downAt }
  let result = null;
  let passTimer;

  const storage = {
    get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
  };

  // ---------- 座標 ----------
  // 舞台座標：#stage 左上角為原點（px）；地圖座標：SVG viewBox
  const stageRect = () => stage.getBoundingClientRect();
  function toMap(p) {
    const r = stageRect();
    const q = new DOMPoint(p.x + r.left, p.y + r.top).matrixTransform(mapSvg.getScreenCTM().inverse());
    return { x: q.x, y: q.y };
  }
  function toStage(p) {
    const r = stageRect();
    const q = new DOMPoint(p.x, p.y).matrixTransform(mapSvg.getScreenCTM());
    return { x: q.x - r.left, y: q.y - r.top };
  }
  function mapRect() {
    const [W, H] = MAPS[current].viewBox;
    const a = toStage({ x: 0, y: 0 }), b = toStage({ x: W, y: H });
    return { x0: a.x, y0: a.y, x1: b.x, y1: b.y };
  }
  function launchPoint() {
    const r = stageRect();
    return { x: r.width / 2, y: r.height - (r.width <= 560 ? 112 : 122) };
  }
  const maxPull = () => { const r = stageRect(); return Math.max(110, Math.min(210, Math.min(r.width, r.height) * 0.3)); };
  /** 飛機最多往後退這麼多（px），力道仍然照手指實際拉的距離算，飛機才不會被拉出畫面 */
  const MAX_PLANE_PULL = 42;

  // ---------- 地圖 ----------
  const SVG_NS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs = {}) => { const e = document.createElementNS(SVG_NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

  function loadMap(key) {
    current = MAPS[key] ? key : "taiwan";
    storage.set(STORE.map, current);
    const m = MAPS[current];
    mapSvg.setAttribute("viewBox", `0 0 ${m.viewBox[0]} ${m.viewBox[1]}`);
    regionsG.replaceChildren(); insetsG.replaceChildren(); pinsG.replaceChildren();
    regions = m.regions.map((data) => {
      const el = svgEl("path", { d: data.d, class: "land" });
      regionsG.append(el);
      const nums = data.d.match(/-?\d+(?:\.\d+)?/g).map(Number);
      const points = [];
      for (let i = 0; i + 1 < nums.length; i += 2) points.push(nums[i], nums[i + 1]);
      return { data, el, path: new Path2D(data.d), points };
    });
    for (const inset of m.insets) {
      const g = svgEl("g", { class: "inset" });
      g.append(svgEl("rect", { x: inset.x, y: inset.y, width: inset.w, height: inset.h, rx: 8 }));
      const label = svgEl("text", { x: inset.x + 10, y: inset.y + 18, "font-size": 13 });
      label.textContent = inset.label;
      g.append(label);
      insetsG.append(g);
    }
    tabs.forEach((t) => t.setAttribute("aria-selected", String(t.dataset.map === current)));
    resetRound();
  }

  function hitTest(p) {
    for (let i = 0; i < regions.length; i++) if (hitCtx.isPointInPath(regions[i].path, p.x, p.y)) return i;
    return -1;
  }

  /** 比對所有區塊邊界點，取距離最近的一點 */
  function nearestLand(p) {
    let best = { d: Infinity, idx: -1, x: 0, y: 0 };
    regions.forEach((r, idx) => {
      const pts = r.points;
      for (let i = 0; i < pts.length; i += 2) {
        const d = (pts[i] - p.x) ** 2 + (pts[i + 1] - p.y) ** 2;
        if (d < best.d) best = { d, idx, x: pts[i], y: pts[i + 1] };
      }
    });
    return best;
  }

  // ---------- 風 ----------
  function newWind() {
    const deg = Math.random() * 360;
    const speed = 1 + Math.floor(Math.random() * 12);
    const level = speed < 4 ? "微風" : speed < 8 ? "和風" : "強風";
    wind = { deg, speed, level, dir: DIRS[Math.round(deg / 45) % 8] };
    $("#compass .arrow").style.transform = `rotate(${deg}deg)`;
    $("#windDir").textContent = `往${wind.dir}吹`;
    $("#windDetail").textContent = `${speed} m/s · ${level}`;
  }
  const windText = () => `往${wind.dir}吹 · ${wind.speed} m/s · ${wind.level}`;

  // ---------- 飛機與彈弓 ----------
  function placePlane(x, y, { rot = 0, scale = 1, lift = 0, shadow = 0 } = {}) {
    planeEl.style.transform = `translate(${x}px, ${y - lift}px) translate(-50%, -50%) rotate(${rot}deg) scale(${scale})`;
    shadowEl.style.transform = `translate(${x}px, ${y + 14}px) translate(-50%, -50%) scale(${1 - shadow * 0.35})`;
    shadowEl.style.opacity = shadow ? String(0.25 + 0.35 * (1 - shadow)) : "0";
  }

  function drawSling(planeAt) {
    const L = launchPoint();
    const left = { x: L.x - 26, y: L.y - 6 }, right = { x: L.x + 26, y: L.y - 6 };
    slingFrame.setAttribute("d", `M${left.x} ${left.y} L${L.x} ${L.y + 22} L${right.x} ${right.y} M${L.x} ${L.y + 22} L${L.x} ${L.y + 50}`);
    const p = planeAt ?? { x: L.x, y: L.y - 2 };
    band.setAttribute("points", `${left.x},${left.y} ${p.x},${p.y} ${right.x},${right.y}`);
  }

  /**
   * 不含風與手抖的拋物線：p(t) = L + v·t + ½·g·t²（y 朝下），t = 1 是落點。
   * 初速配合重力，力道 100% 往上射剛好飛到最遠的角落
   */
  function ballistic(strength, dir) {
    const L = launchPoint(), R = mapRect();
    const reach = Math.max(...[[R.x0, R.y0], [R.x1, R.y0], [R.x0, R.y1], [R.x1, R.y1]].map(([x, y]) => Math.hypot(x - L.x, y - L.y)));
    const g = reach * GRAVITY;
    const speed = strength * (reach + g / 2);
    const v = { x: dir.x * speed, y: dir.y * speed };
    return { L, R, g, at: (t) => ({ x: L.x + v.x * t, y: L.y + v.y * t + 0.5 * g * t * t }) };
  }

  function setPullUI(p) {
    const strength = Math.min(1, Math.hypot(p.x, p.y) / maxPull());
    powerBar.style.width = `${Math.round(strength * 100)}%`;
    powerText.textContent = `力道 ${Math.round(strength * 100)}%`;
    // 虛線拋物線只畫前段，而且不含風和手抖，保留碰運氣的成分
    const len = Math.hypot(p.x, p.y) || 1;
    const b = ballistic(strength, { x: -p.x / len, y: -p.y / len });
    let d = `M${b.L.x} ${b.L.y}`;
    for (let t = 0.03; t <= PREVIEW_FRACTION + 1e-9; t += 0.03) {
      const q = b.at(t);
      d += ` L${q.x.toFixed(1)} ${q.y.toFixed(1)}`;
    }
    arc.setAttribute("d", d);
    arc.setAttribute("opacity", strength >= MIN_POWER ? "1" : "0.35");
    return strength;
  }

  function setBlur(px) {
    mapSvg.style.filter = px > 0.1 ? `blur(${px}px)` : "";
    fog.style.opacity = String((px / BLUR_MAX) * 0.85);
  }

  function setTabsEnabled(on) { tabs.forEach((t) => (t.disabled = !on)); }

  // ---------- 拉弓 ----------
  stage.addEventListener("pointerdown", (e) => {
    if (state !== "idle" || e.button > 0) return;
    if (e.target.closest("button, #logPanel, #pass, #compass")) return;
    e.preventDefault();
    logPanel.classList.remove("open");
    stage.setPointerCapture(e.pointerId);
    const r = stageRect();
    pull = { id: e.pointerId, sx: e.clientX - r.left, sy: e.clientY - r.top, x: 0, y: 0, downAt: performance.now() };
    state = "pulling";
    setTabsEnabled(false);
    power.style.opacity = "1";
    hint.textContent = "往後拉，看準方向…";
    requestAnimationFrame(pullTick);
  });

  stage.addEventListener("pointermove", (e) => {
    if (state !== "pulling" || e.pointerId !== pull.id) return;
    const r = stageRect();
    let x = e.clientX - r.left - pull.sx, y = e.clientY - r.top - pull.sy;
    const len = Math.hypot(x, y), max = maxPull();
    if (len > max) { x *= max / len; y *= max / len; }
    pull.x = x; pull.y = y;
  });

  function pullTick(now) {
    if (state !== "pulling") return;
    const L = launchPoint();
    const len = Math.hypot(pull.x, pull.y) || 1;
    const shown = (MAX_PLANE_PULL * Math.min(1, len / maxPull())) / len;
    const at = { x: L.x + pull.x * shown, y: L.y + pull.y * shown };
    placePlane(at.x, at.y, { rot: (Math.atan2(-pull.x / len, pull.y / len) * 180) / Math.PI });
    drawSling(at);
    setPullUI(pull);
    // 拉得越久，地圖越模糊
    const held = now - pull.downAt;
    const blur = held < BLUR_DELAY ? 0 : Math.min(BLUR_MAX, ((held - BLUR_DELAY) / BLUR_FULL) * BLUR_MAX);
    setBlur(blur);
    if (blur >= BLUR_MAX) hint.textContent = "什麼都看不到了…憑感覺！";
    else if (blur > 3) hint.textContent = "畫面越來越模糊…";
    requestAnimationFrame(pullTick);
  }

  function endPull(e) {
    if (state !== "pulling" || e.pointerId !== pull.id) return;
    const strength = Math.min(1, Math.hypot(pull.x, pull.y) / maxPull());
    const len = Math.hypot(pull.x, pull.y) || 1;
    const dir = { x: -pull.x / len, y: -pull.y / len };
    pull = null;
    arc.setAttribute("opacity", "0");
    power.style.opacity = "0";
    powerText.textContent = "";
    if (strength < MIN_POWER || e.type === "pointercancel") {
      setBlur(0);
      toast("拉遠一點再放手");
      resetPlane();
      state = "idle";
      setTabsEnabled(true);
      hint.textContent = "按住畫面任一處往後拉，放開就起飛";
      return;
    }
    fly(strength, dir);
  }
  stage.addEventListener("pointerup", endPull);
  stage.addEventListener("pointercancel", endPull);

  // ---------- 飛行 ----------
  function gauss() {
    const u = 1 - Math.random(), v = Math.random();
    const r = Math.sqrt(-2 * Math.log(u));
    return [r * Math.cos(2 * Math.PI * v), r * Math.sin(2 * Math.PI * v)];
  }
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  function fly(strength, dir) {
    state = "flying";
    hint.textContent = "起飛！";
    drawSling(null);
    const b = ballistic(strength, dir);
    const { L, R } = b;
    const ideal = b.at(1);
    const dist = Math.hypot(ideal.x - L.x, ideal.y - L.y);
    const rad = (wind.deg * Math.PI) / 180, drift = dist * (wind.speed / 12) * WIND_FACTOR;
    const W = { x: Math.sin(rad) * drift, y: -Math.cos(rad) * drift };
    const [jx, jy] = gauss(), shake = 5 + dist * 0.02;
    const end = {
      x: clamp(ideal.x + W.x + jx * shake, R.x0 + 3, R.x1 - 3),
      y: clamp(ideal.y + W.y + jy * shake, R.y0 + 3, R.y1 - 3),
    };
    // 重力和風的偏移都隨時間平方增加：p(t) = L + A·t + B·t²。沒有風、手抖時就是虛線那條拋物線
    const B = { x: W.x, y: b.g / 2 + W.y };
    const A = { x: end.x - L.x - B.x, y: end.y - L.y - B.y };
    const duration = 1000 + 900 * strength;
    const peak = 26 + 54 * strength;
    const start = performance.now();
    const points = [];

    function frame(now) {
      const t = Math.min(1, (now - start) / duration);
      const x = L.x + A.x * t + B.x * t * t, y = L.y + A.y * t + B.y * t * t;
      const vx = A.x + 2 * B.x * t, vy = A.y + 2 * B.y * t;
      const arc = Math.sin(Math.PI * t);
      placePlane(x, y, { rot: (Math.atan2(vx, -vy) * 180) / Math.PI, scale: 1 + 0.75 * arc, lift: peak * arc, shadow: arc });
      points.push(`${x.toFixed(1)},${y.toFixed(1)}`);
      trail.setAttribute("points", points.join(" "));
      if (t < 1) requestAnimationFrame(frame);
      else land(end);
    }
    requestAnimationFrame(frame);
  }

  // ---------- 降落 ----------
  async function land(at) {
    setBlur(0);  // 降落瞬間解除模糊，揭曉結果
    let mp = toMap(at);
    let idx = hitTest(mp);
    let diverted = false;
    if (idx < 0) {
      diverted = true;
      toast("🌊 差點掉進海裡！機長緊急改降最近的陸地");
      const near = nearestLand(mp);
      idx = near.idx;
      mp = { x: near.x, y: near.y };
      await slideTo(at, toStage(mp), 800);
    }
    const region = regions[idx];
    region.el.classList.add("hit");
    regionsG.append(region.el);  // 移到最上層，紅色邊框不被鄰居蓋住
    addPin(mp);
    planeEl.style.transition = "opacity 0.4s";
    planeEl.style.opacity = "0";
    shadowEl.style.opacity = "0";
    state = "landed";
    setTabsEnabled(true);
    hint.textContent = "";
    result = { region: region.data, diverted, map: current };
    saveLog(result);
    passTimer = setTimeout(showPass, 650);
  }

  function slideTo(from, to, ms) {
    return new Promise((resolve) => {
      const start = performance.now();
      const rot = (Math.atan2(to.x - from.x, -(to.y - from.y)) * 180) / Math.PI;
      (function frame(now) {
        const t = Math.min(1, (now - start) / ms);
        const e = 1 - (1 - t) ** 3;
        placePlane(from.x + (to.x - from.x) * e, from.y + (to.y - from.y) * e, { rot });
        if (t < 1) requestAnimationFrame(frame); else resolve();
      })(start);
    });
  }

  function addPin(p) {
    const u = 1 / mapSvg.getScreenCTM().a;  // 1px 對應幾個 viewBox 單位
    const g = svgEl("g");
    g.append(svgEl("circle", { cx: p.x, cy: p.y, r: 6 * u, class: "pin-ripple", "stroke-width": 2 * u }));
    g.append(svgEl("circle", { cx: p.x, cy: p.y, r: 6 * u, class: "pin-ripple late", "stroke-width": 2 * u }));
    g.append(svgEl("line", { x1: p.x, y1: p.y, x2: p.x, y2: p.y - 22 * u, stroke: "#1d2433", "stroke-width": 2.5 * u, "stroke-linecap": "round" }));
    g.append(svgEl("circle", { cx: p.x, cy: p.y - 24 * u, r: 7 * u, fill: "#e5484d", stroke: "#fff", "stroke-width": 2 * u }));
    pinsG.append(g);
  }

  // ---------- 登機證 ----------
  function showPass() {
    const r = result.region;
    const flight = `DT${String(Math.floor(Math.random() * 900) + 100)}`;
    const d = new Date();
    const date = `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
    const seat = `${Math.floor(Math.random() * 45) + 1}${"ABCDEFGHJK"[Math.floor(Math.random() * 10)]}`;
    $("#toCode").textContent = r.c;
    $("#toName").textContent = r.n;
    $("#destName").textContent = `${r.f ? r.f + " " : ""}${r.n}`;
    $("#destEn").textContent = r.e;
    $("#passNote").textContent = result.diverted ? "備註：原定降落點在海上，已緊急改降至最近陸地" : `備註：降落時風向 ${windText()}`;
    $("#flightNo").textContent = flight;
    $("#flightDate").textContent = date;
    $("#seat").textContent = seat;
    const bars = $("#barcode");
    bars.replaceChildren(...Array.from({ length: 26 }, () => {
      const i = document.createElement("i");
      i.style.flex = String(1 + Math.floor(Math.random() * 3));
      return i;
    }));
    result.flight = flight;
    pass.classList.add("show");
    pass.setAttribute("aria-hidden", "false");
  }

  $("#again").addEventListener("click", resetRound);
  $("#share").addEventListener("click", async () => {
    if (!result) return;
    const r = result.region;
    const text = `✈ DartTrip 飛鏢旅行：我的紙飛機降落在 ${r.f ? r.f + " " : ""}${r.n}（${r.e}），下一趟就去這裡！航班 ${result.flight}`;
    const mobile = matchMedia("(pointer: coarse)").matches;
    if (mobile && navigator.share) {
      try { await navigator.share({ title: "DartTrip 飛鏢旅行", text, url: location.href }); } catch {}
      return;
    }
    try {
      await navigator.clipboard.writeText(`${text} ${location.href}`);
      toast("已複製到剪貼簿");
    } catch {
      toast("無法複製，請手動複製網址");
    }
  });

  // ---------- 一輪的開始 ----------
  function resetPlane() {
    planeEl.style.transition = "";
    planeEl.style.opacity = "1";
    const L = launchPoint();
    placePlane(L.x, L.y - 2);
    drawSling(null);
  }

  function resetRound() {
    clearTimeout(passTimer);
    state = "idle";
    result = null;
    pass.classList.remove("show");
    pass.setAttribute("aria-hidden", "true");
    regions.forEach((r) => r.el.classList.remove("hit"));
    pinsG.replaceChildren();
    trail.setAttribute("points", "");
    setBlur(0);
    newWind();
    resetPlane();
    setTabsEnabled(true);
    hint.textContent = "按住畫面任一處往後拉，放開就起飛";
  }

  // ---------- 飛行紀錄、Toast ----------
  function saveLog(res) {
    const log = storage.get(STORE.log, []);
    log.unshift({ n: res.region.n, f: res.region.f || "", e: res.region.e, map: MAPS[res.map].label, at: Date.now() });
    storage.set(STORE.log, log.slice(0, 20));
    renderLog();
  }

  function renderLog() {
    const log = storage.get(STORE.log, []);
    const list = $("#logList");
    if (!log.length) {
      list.innerHTML = '<li class="empty">還沒有紀錄，射一架看看！</li>';
      return;
    }
    list.replaceChildren(...log.map((item) => {
      const li = document.createElement("li");
      const name = document.createElement("span");
      name.textContent = `${item.f ? item.f + " " : ""}${item.n}`;
      const meta = document.createElement("small");
      const d = new Date(item.at);
      meta.textContent = `${item.map} · ${d.getMonth() + 1}/${d.getDate()}`;
      li.append(name, meta);
      return li;
    }));
  }

  $("#logBtn").addEventListener("click", () => logPanel.classList.toggle("open"));

  let toastTimer;
  function toast(message) {
    toastEl.textContent = message;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
  }

  tabs.forEach((t) => t.addEventListener("click", () => {
    if (state === "pulling" || state === "flying") return;
    loadMap(t.dataset.map);
  }));

  addEventListener("resize", () => { if (state === "idle") resetPlane(); });

  renderLog();
  loadMap(storage.get(STORE.map, "taiwan"));
})();
</script>
</body>
</html>
